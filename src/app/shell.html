<header class="site-header glass" [class.condensed]="showToTop()">
  <nav class="nav container">
    <a class="brand" href="#home" (click)="onNavClick('home', $event)">{{ title() | titlecase }}</a>

    <button class="nav-toggle" type="button" aria-label="Toggle navigation" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="menu" [class.open]="menuOpen()">
      <li><a href="#home" [class.active]="activeSection() === 'home'" (click)="onNavClick('home', $event)">Home</a></li>
      <li><a href="#about" [class.active]="activeSection() === 'about'" (click)="onNavClick('about', $event)">About Me</a></li>
      <li><a href="#skills" [class.active]="activeSection() === 'skills'" (click)="onNavClick('skills', $event)">Skills</a></li>
      <li><a href="#projects" [class.active]="activeSection() === 'projects'" (click)="onNavClick('projects', $event)">Projects</a></li>
      <li><a href="#contact" [class.active]="activeSection() === 'contact'" (click)="onNavClick('contact', $event)">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="site-bg" 
      [class.home-mode]="activeSection() === 'home'" 
      [class.about-mode]="activeSection() === 'about'"
      [class.skills-mode]="activeSection() === 'skills'"
      [class.projects-mode]="activeSection() === 'projects'"
      [class.contact-mode]="activeSection() === 'contact'"
      [class.sections-mode]="activeSection() !== 'home'">
  
  <!-- Rocket Scroll Indicator -->
  <div class="rocket-container">
    <!-- Moon at top (destination) -->
    <div class="moon-destination"></div>
    
    <!-- Launch Platform (Earth at bottom - partial view) -->
    <div class="earth-platform"></div>
    
    <!-- Rocket -->
    <div class="rocket" 
         [style.top.%]="scrollProgress()"
         [attr.data-section]="activeSection()"
         [class.direction-up]="scrollDirection() === 'up'"
         [class.direction-down]="scrollDirection() === 'down'">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <!-- Rocket body -->
        <path d="M12 2c-1.5 0-2.5 1.5-3 3l-1 3v8l1 2h6l1-2V8l-1-3c-.5-1.5-1.5-3-3-3z"/>
        <!-- Flames -->
        <path d="M9 18l1 3 2-1 2 1 1-3z" opacity="0.7"/>
        <!-- Window -->
        <circle cx="12" cy="8" r="1.5" fill="rgba(255,255,255,0.8)"/>
        <!-- Side fins -->
        <path d="M8 12l-2 3 2 1z"/>
        <path d="M16 12l2 3-2 1z"/>
      </svg>
    </div>
  </div>
  
  <div class="site-main container">
    <router-outlet></router-outlet>
  </div>
  
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <small>© {{ year }} — All rights reserved.</small>
    <div class="social">
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</footer>

@if (showToTop()) {
  <button class="to-top" type="button" aria-label="Back to top" (click)="scrollToTop()">↑</button>
}
